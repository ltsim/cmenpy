site_name: cmenpy
site_description: Compute Metaheuristic Engine for Python — a NumPy/Numba framework for population-based metaheuristics
site_author: LTSIM
site_url: https://ltsim.github.io/cmenpy/
repo_url: https://github.com/ltsim/cmenpy
repo_name: ltsim/cmenpy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 LTSIM

# Rebuild when the package source changes (mkdocstrings reads it live).
watch:
  - cmenpy

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  logo: assets/cmenpy.png
  favicon: assets/icon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ltsim/cmenpy
      name: cmenpy on GitHub

extra_css:
  - assets/css/tokens.css
  - assets/css/theme.css
  - assets/css/brand.css

extra_javascript:
  - assets/scripts.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            show_bases: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Examples: examples.md
      - Test functions: benchmarks.md
  - Guides:
      - Models:
          - Overview: models/index.md
          - Function style (declare): models/declare.md
          - Class style (template): models/template.md
          - Fields and markers: models/fields.md
          - Operator modules: models/modules.md
          - Build a custom model: tutorial-custom-model.md
      - Population:
          - Overview: population/index.md
          - Matrix views: population/views.md
          - Stream operators: population/operators.md
          - Iteration and ranking: population/ranking.md
          - Agents: population/agents.md
      - Target functions:
          - Overview: target/index.md
          - Scoring modes: target/scoring.md
          - Vectorized targets: target/vectorized.md
          - NFE budget: target/budget.md
      - Numba kernels:
          - Overview: compile/index.md
          - Typing and specs: compile/specs.md
          - precompile (njit): compile/precompile.md
          - vectorize (ufunc): compile/vectorize.md
          - reduce (guvectorize): compile/reduce.md
          - Compilation options: compile/options.md
          - Troubleshooting: compile/troubleshooting.md
  - API Reference:
      - Overview: api/index.md
      - Classes: api/classes.md
      - Functions: api/functions.md
      - Modules: api/modules.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
