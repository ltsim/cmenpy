[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmenpy"
dynamic = ["version"]
description = "An extensible Python framework for designing and benchmarking metaheuristics"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }

authors = [
    { name = "ltsim", email = "tsim@cucei.udg.mx" }
]

keywords = [
    "metaheuristics",
    "metaheuristic design",
    "evolutionary computation",
    "population-based algorithms",
    "nature-inspired algorithms",
    "hybrid algorithms",
    "adaptive search",
    "self-adaptation",
    "benchmark functions",
    "performance analysis",
    "exploration versus exploitation",
    "stochastic optimization",
    "global optimization",
    "black-box optimization",
    "soft computing"
]

classifiers = [
    "Typing :: Typed",
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: System :: Benchmark",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9.0",
    "twine>=5.0",
    "flake8>=7.0",
    "pandas-stubs>=2.2.3",
    "scipy-stubs>=1.15.0",
    "black>=21.9b0"
]

[project.urls]
"Homepage" = "https://github.com/ltsim/cmenpy"
"Source Code" = "https://github.com/ltsim/cmenpy"
"Bug Tracker" = "https://github.com/ltsim/cmenpy/issues"
"Change Log" = "https://github.com/ltsim/cmenpy/blob/master/CHANGELOG.md"

[tool.isort]
profile = "black"

[tool.setuptools.dynamic]
version = { attr = "cmenpy.__version__" }

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
files = ["cmenpy"]
exclude = ["tests/", "docs/", "examples/"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git

  | \.mypy_cache
  | \.venv
  | .github
  | build
  | dist
  | example
)/
'''
